openapi: 3.0.3
info:
  title: Go Connect API
  description: Service marketplace backend API.
  version: 2.0.0
servers:
- url: https://go-connect-too-backend.vercel.app/api/v1
  description: Production (Vercel)
- url: http://localhost:8080/api/v1
  description: Local development
tags:
- name: Health
- name: Auth
- name: Employees
- name: Employee Services
- name: Categories
- name: Public
- name: Users
- name: Search
- name: Bookings
- name: Subscriptions
- name: Payments
- name: Notifications
- name: Chat
- name: WebSocket
- name: Admin
- name: Analytics
- name: Settings
- name: Reports
- name: Support
- name: KYC
- name: Uploads
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessEnvelope'
        '503':
          description: Service unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/register/customer:
    post:
      tags:
      - Auth
      summary: Register customer
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register/employee:
    post:
      tags:
      - Auth
      summary: Register employee
      operationId: registerEmployee

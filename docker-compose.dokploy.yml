# Dokploy Compose deployment — API + Postgres + MinIO
#
# In Dokploy: Add Service → Compose → point to this file.
# Set variables in the Compose "Environment" tab (see deploy/dokploy/env.example).
#
# Dokploy Domains (add each, then redeploy):
#   api.connectoo.online      → service "api"      → port 8080
#   minio.connectoo.online    → service "minio"    → port 9001  (web console)
#   www.connectoo.online      → service "website"  → port 3010  (not 3000 — Dokploy UI)
#   admin.connectoo.online    → service "admin"    → port 3001
#   app.connectoo.online      → service "customer" → port 3002
#   provider.connectoo.online → service "employee" → port 3003
#
# DNS: A records for each subdomain → your server IP.
# API talks to MinIO S3 internally at http://minio:9000 (not via public domain).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: go_connect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d go_connect"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Required when console is behind Traefik at https://minio.connectoo.online
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://minio.connectoo.online}
    volumes:
      - minio_data:/data
    ports:
      - "9001"
    networks:
      - dokploy-network

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/go-connect-uploads;
      echo 'bucket go-connect-uploads ready';
      "
    networks:
      - dokploy-network

  migrate:
    image: migrate/migrate
    restart: "no"
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://app:${POSTGRES_PASSWORD}@postgres:5432/go_connect?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/go_connect?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME_SEC: ${DB_CONN_MAX_LIFETIME_SEC:-300}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_BUCKET: ${S3_BUCKET:-go-connect-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_BASE_URL: ${S3_BASE_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080"
    networks:
      - dokploy-network

  website:
    build:
      context: ./web/website
      dockerfile: ../../deploy/dokploy/Dockerfile.next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CUSTOMER_PORTAL_URL: ${NEXT_PUBLIC_CUSTOMER_PORTAL_URL:?set NEXT_PUBLIC_CUSTOMER_PORTAL_URL}
        NEXT_PUBLIC_EMPLOYEE_PORTAL_URL: ${NEXT_PUBLIC_EMPLOYEE_PORTAL_URL:?set NEXT_PUBLIC_EMPLOYEE_PORTAL_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3010"
    networks:
      - dokploy-network

  admin:
    build:
      context: ./web/admin
      dockerfile: ../../deploy/dokploy/Dockerfile.next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3001"
    networks:
      - dokploy-network

  customer:
    build:
      context: ./web/customer
      dockerfile: ../../deploy/dokploy/Dockerfile.next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3002"
    networks:
      - dokploy-network

  employee:
    build:
      context: ./web/employee
      dockerfile: ../../deploy/dokploy/Dockerfile.next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: "3003"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3003"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  minio_data:

networks:
  dokploy-network:
    external: true

# Local VPC simulation — Nginx on :8880, *.localhost → 127.0.0.1
# Used by: scripts/dev-vpc.sh

worker_processes 1;
error_log .dev/logs/nginx-error.log;
pid .dev/pids/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log .dev/logs/nginx-access.log;

    server {
        listen 8880;
        server_name www.localhost;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /files/ {
            proxy_pass http://127.0.0.1:9000/go-connect-uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 8880;
        server_name admin.localhost;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /files/ {
            proxy_pass http://127.0.0.1:9000/go-connect-uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 8880;
        server_name app.localhost;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /files/ {
            proxy_pass http://127.0.0.1:9000/go-connect-uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 8880;
        server_name provider.localhost;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /files/ {
            proxy_pass http://127.0.0.1:9000/go-connect-uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host $host;
        }
    }
}

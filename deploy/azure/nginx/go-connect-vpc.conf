# VPC mode: frontends + dedicated api.${DOMAIN} public; backends on 127.0.0.1 only.
# Render: envsubst < deploy/azure/nginx/go-connect-vpc.conf | sudo tee /etc/nginx/sites-available/go-connect

# Shared proxy snippets inlined per server block (envsubst does not support includes)

server {
    listen 80;
    server_name www.${DOMAIN};

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:9000/go-connect-uploads/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


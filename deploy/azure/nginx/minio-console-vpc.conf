# MinIO web console — proxy to 127.0.0.1:9001 (never expose 9001 publicly).
# Render: envsubst '$DOMAIN' < deploy/azure/nginx/minio-console-vpc.conf | sudo tee /etc/nginx/sites-available/minio-console
# Shared Let's Encrypt cert (certificate name = www.${DOMAIN}).

server {
    listen 80;
    server_name minio.${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name minio.${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/www.${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.${DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400;
        client_max_body_size 100M;
    }
}

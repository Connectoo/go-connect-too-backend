# MinIO web console — proxy to 127.0.0.1:9001 (never expose 9001 publicly).
# Render: envsubst < deploy/azure/nginx/minio-console-vpc.conf | sudo tee /etc/nginx/sites-available/minio-console
# HTTPS added by certbot in enable-minio-console-vpc.sh

server {
    listen 80;
    server_name minio.${DOMAIN};

    auth_basic "MinIO Console";
    auth_basic_user_file /etc/nginx/.htpasswd-minio;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400;
        client_max_body_size 100M;
    }
}
